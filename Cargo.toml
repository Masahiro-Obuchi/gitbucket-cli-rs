[package]
name = "gitbucket-cli"
version = "0.6.1"
edition = "2021"
description = "A command-line tool for GitBucket, inspired by GitHub CLI"
license = "MIT"
repository = "https://github.com/Masahiro-Obuchi/gitbucket-cli-rs"
readme = "README.md"
keywords = ["gitbucket", "cli", "git"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  ".codex",
  ".codex/**",
  ".github",
  ".github/**",
  "AGENTS.md",
  "docker",
  "docker/**",
  "RELEASE.md",
  "scripts",
  "scripts/**",
  "skills",
  "skills/**",
  "TESTING.md",
]

[[bin]]
name = "gb"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
reqwest = { version = "0.12", features = [
  "cookies",
  "json",
  "rustls-tls-native-roots",
], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
dirs = "6"
thiserror = "2"
colored = "3"
unicode-width = "0.2"
unicode-segmentation = "1"
dialoguer = "0.11"
toml = "0.8"
open = "5"
url = "2"
percent-encoding = "2"
fs2 = "0.4"
ring = "0.17"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
scraper = { version = "0.24", default-features = false }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
