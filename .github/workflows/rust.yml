name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-archives:
    uses: ./.github/workflows/archive.yml
    with:
      # Keep queued archive jobs on this run's commit if the branch/PR advances.
      ref: ${{ github.sha }}
      # Preview artifacts only: this workflow creates no tag or release.
      tag: v0.0.0-archive-test

  msrv:
    name: MSRV (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Keep this in sync with package.rust-version in Cargo.toml.
          toolchain: "1.88.0"
          target: ${{ matrix.target }}
      - name: Check all targets and features at MSRV
        run: cargo check --locked --all-targets --all-features --target ${{ matrix.target }}
      - name: Run the ordinary suite at MSRV
        if: runner.os == 'Linux'
        run: cargo test --locked --all-features --target ${{ matrix.target }}
      - name: Test source package selection at MSRV
        if: runner.os != 'Linux'
        run: cargo test --locked --test package_contents --target ${{ matrix.target }}
      - name: Verify source package at MSRV
        if: runner.os == 'Linux'
        run: cargo package --locked --offline

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Check
        run: cargo check --locked
      - name: Run tests
        run: cargo test --locked
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Verify source package
        run: cargo package --locked --offline

  git-auth-platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Test Git credential helper integration
        run: cargo test --locked --test git_credentials
      - name: Test atomic configuration and process locking
        run: cargo test --locked --test config_storage
      - name: Test profile authentication and guarded migration
        run: cargo test --locked --test auth_profiles
      - name: Test CLI errors and pipe output
        run: cargo test --locked --test cli_errors_output
      - name: Test explicit input and terminal display
        run: cargo test --locked --test input_display
      - name: Test editor lifecycle and explicit terminal input
        run: cargo test --locked --bin gb cli::editor::tests
      - name: Test editor command integration
        run: cargo test --locked --test editor_input --test pr_review_write
      - name: Test merge head checks and result verification
        run: cargo test --locked --test pr_merge
      - name: Test source package file selection
        run: cargo test --locked --test package_contents
      - name: Test configuration storage unit cases
        run: 'cargo test --locked --bin gb config::'
      - name: Test safe PR checkout
        run: cargo test --locked --test pr_checkout
      - name: Test Git deadlines and input cancellation
        run: cargo test --locked --test git_timeouts --test cancellation
